name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build static library
        run: make

      - name: Build
        run: go build ./nozzle/

      - name: Vet
        run: go vet ./nozzle/

      - name: Test
        run: go test ./nozzle/ -v -count=1
